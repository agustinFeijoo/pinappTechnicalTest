<h2>Student Attendance History</h2>

<div>

  <label>
    Student ID
  </label>

  <input
    type="number"
    [(ngModel)]="studentId"
  >

</div>

<br>

<div>

  <label>
    Start Date
  </label>

  <input
    type="date"
    [(ngModel)]="startDate"
  >

</div>

<br>

<div>

  <label>
    End Date
  </label>

  <input
    type="date"
    [(ngModel)]="endDate"
  >

</div>

<br>

<button (click)="search()">
  Search
</button>

@if(loading){
<p>Loading...</p>
}

@if(errorMessage){
<p>{{ errorMessage }}</p>
}

@if(records.length > 0){

<table>

  <thead>
    <tr>
      <th>Date</th>
      <th>Status</th>
    </tr>
  </thead>

  <tbody>

    @for(
      record of records;
      track record.date
    ){

    <tr>

      <td>
        {{ record.date }}
      </td>

      <td>
        {{ record.status }}
      </td>

    </tr>

    }

  </tbody>

</table>

}
